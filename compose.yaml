services:
  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    restart: always
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "${RESOURCE_DB_PORT}:5432"
    volumes:
      - resource_db_data:/var/lib/postgresql/data
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro

  song-db:
    image: postgres:17-alpine
    container_name: song-db
    restart: always
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "${SONG_DB_PORT}:5432"
    volumes:
      - song_db_data:/var/lib/postgresql/data
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro

  song-service:
    build:
      context: .
      dockerfile: song-service/Dockerfile
    container_name: song-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "${SONG_SERVICE_PORT}:8081"
    depends_on:
      - song-db

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${S3_SERVICE_REGION}
    volumes:
      - localstack_data:/var/lib/localstack

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    container_name: resource-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
      AWS_S3_ENDPOINT: ${S3_SERVICE_URL}
      AWS_S3_REGION: ${S3_SERVICE_REGION}
      AWS_S3_BUCKET: ${S3_SERVICE_BUCKET}
      AWS_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RESOURCE_QUEUE: ${RABBITMQ_QUEUE}
    ports:
      - "${RESOURCE_SERVICE_PORT}:8080"
    depends_on:
      - resource-db
      - localstack
      - rabbitmq

volumes:
  resource_db_data:
  song_db_data:
  localstack_data:
  rabbitmq_data:
