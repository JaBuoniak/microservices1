spring.application.name=gateway-service
server.port=${GATEWAY_SERVICE_PORT:8088}

# Eureka Discovery Client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Spring Cloud Gateway Route Definitions
spring.cloud.gateway.routes[0].id=song-service
spring.cloud.gateway.routes[0].uri=lb://song-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/songs/**

spring.cloud.gateway.routes[1].id=resource-service
spring.cloud.gateway.routes[1].uri=lb://resource-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/resources/**

spring.cloud.gateway.routes[2].id=storage-service
spring.cloud.gateway.routes[2].uri=lb://storage-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/storages/**

# Actuator & Metrics export to Elasticsearch
management.endpoints.web.exposure.include=health,info,metrics
management.elastic.metrics.export.host=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
management.elastic.metrics.export.step=10s
management.elastic.metrics.export.auto-create-index=true
management.elastic.metrics.export.index=metrics-spring
management.metrics.tags.application=${spring.application.name}

# Distributed Tracing
management.tracing.sampling.probability=1.0


