spring.application.name=resource-processor
spring.main.web-application-type=none

# RabbitMQ configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# RabbitMQ listener
resource.queue=${RESOURCE_QUEUE:resource-processing-queue}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Services
resource.service.url=${RESOURCE_SERVICE_URL:http://localhost:8080/resources}
song.service.url=${SONG_SERVICE_URL:http://localhost:8081/songs}

# Logging for retry
logging.level.org.springframework.retry=DEBUG

# Eureka Client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
