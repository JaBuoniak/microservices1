spring.application.name=resource-processor
spring.main.web-application-type=none

# RabbitMQ configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# RabbitMQ listener
resource.queue=${RESOURCE_QUEUE:resource-processing-queue}
resource.processed.queue=${RESOURCE_PROCESSED_QUEUE:resource-processed-queue}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Services
resource.service.url=${RESOURCE_SERVICE_URL:http://localhost:8080/resources}
song.service.url=${SONG_SERVICE_URL:http://localhost:8081/songs}

# Logging for retry
logging.level.org.springframework.retry=INFO
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN

# Eureka Client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# Actuator & Metrics export to Elasticsearch
management.elastic.metrics.export.host=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
management.elastic.metrics.export.step=10s
management.elastic.metrics.export.auto-create-index=true
management.elastic.metrics.export.index=metrics-spring
management.metrics.tags.application=${spring.application.name}

# Distributed Tracing
management.tracing.sampling.probability=1.0
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true


