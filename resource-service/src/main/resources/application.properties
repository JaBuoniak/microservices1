# Resource service server
spring.application.name=resource-service
server.port=8080

# Song service client
song.service.url=http://localhost:8081/songs

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/resource_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# S3 / LocalStack configuration
aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1
aws.s3.bucket=resources
aws.s3.access-key-id=test
aws.s3.secret-access-key=test

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ queue
resource.queue=resource-processing-queue

# RabbitMQ retrying
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000ms
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-attempts=5

# Logging for retry
logging.level.org.springframework.retry=DEBUG