# Resource service server
spring.application.name=resource-service
server.port=8080

# Song service client
song.service.url=${SONG_SERVICE_URL:http://song-service/songs}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Eureka Client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# S3 / LocalStack configuration
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:resources}
aws.s3.access-key-id=${AWS_S3_ACCESS_KEY_ID:test}
aws.s3.secret-access-key=${AWS_S3_SECRET_ACCESS_KEY:test}
