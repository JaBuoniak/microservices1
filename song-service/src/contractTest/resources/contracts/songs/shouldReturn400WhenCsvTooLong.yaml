name: shouldReturn400WhenCsvTooLong
description: "Should return 400 Bad Request when CSV parameter exceeds 200 characters"

request:
  method: DELETE
  urlPath: /songs
  queryParameters:
    id: "1,3,5,7,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84,87,90,93,96,99,103,107,111,115,119,123,127,131,135,139,143,147,151,155,159,163,167,171,175,179,183,187,191,195,199,203"

response:
  status: 400
  headers:
    Content-Type: application/json
  body:
    errorMessage: "CSV string is too long: received 203 characters, maximum allowed is 200"
    errorCode: "400"
